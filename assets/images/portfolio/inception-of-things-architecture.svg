<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="430" viewBox="0 0 1080 430" role="img" aria-labelledby="title desc">
  <title id="title">Inception of Things Kubernetes infrastructure</title>
  <desc id="desc">A physical host uses QEMU/KVM to run an outer Debian VM. Inside it, Part 1 provisions a two-node K3s cluster with Vagrant and libvirt, Part 2 serves three applications through Traefik, and Part 3 runs a Docker-hosted K3d cluster reconciled by Argo CD from GitHub manifests.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#496f5d"/>
    </marker>
  </defs>
  <rect width="1080" height="430" rx="18" fill="#fffaf0"/>
  <g font-family="Quicksand, Arial, sans-serif" fill="#26302b">
    <text x="540" y="42" text-anchor="middle" font-size="28" font-weight="600" fill="#496f5d">Inception of Things</text>

    <rect x="30" y="184" width="135" height="78" rx="12" fill="#e7f0e8" stroke="#a9bcae" stroke-width="2"/>
    <text x="97" y="215" text-anchor="middle" font-size="20" font-weight="600">physical host</text>
    <text x="97" y="239" text-anchor="middle" font-size="14" font-weight="500">QEMU / KVM</text>
    <path d="M165 223 H204" stroke="#496f5d" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

    <rect x="210" y="74" width="840" height="330" rx="20" fill="#f1f6ef" stroke="#a9bcae" stroke-width="2"/>
    <text x="232" y="106" font-size="20" font-weight="600" fill="#496f5d">iot-vm · Debian outer VM</text>

    <rect x="230" y="136" width="245" height="230" rx="14" fill="#fffaf0" stroke="#a9bcae" stroke-width="2"/>
    <text x="352" y="166" text-anchor="middle" font-size="18" font-weight="600">Part 1 · K3s cluster</text>
    <rect x="252" y="183" width="200" height="30" rx="8" fill="#26302b" opacity=".92"/>
    <text x="352" y="204" text-anchor="middle" font-size="15" font-weight="600" fill="#fffaf0">Vagrant · libvirt</text>
    <rect x="247" y="237" width="88" height="53" rx="10" fill="#e7f0e8" stroke="#a9bcae" stroke-width="2"/>
    <text x="291" y="260" text-anchor="middle" font-size="15" font-weight="600">K3s</text>
    <text x="291" y="279" text-anchor="middle" font-size="13" font-weight="500">server</text>
    <rect x="370" y="237" width="88" height="53" rx="10" fill="#e7f0e8" stroke="#a9bcae" stroke-width="2"/>
    <text x="414" y="260" text-anchor="middle" font-size="15" font-weight="600">K3s</text>
    <text x="414" y="279" text-anchor="middle" font-size="13" font-weight="500">agent</text>
    <path d="M335 263 H361" stroke="#496f5d" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <rect x="257" y="312" width="190" height="27" rx="8" fill="#26302b" opacity=".92"/>
    <text x="352" y="331" text-anchor="middle" font-size="13" font-weight="600" fill="#fffaf0">NFS join token · nested VMs</text>

    <rect x="507" y="136" width="245" height="230" rx="14" fill="#fffaf0" stroke="#a9bcae" stroke-width="2"/>
    <text x="629" y="166" text-anchor="middle" font-size="18" font-weight="600">Part 2 · Applications</text>
    <rect x="529" y="183" width="200" height="30" rx="8" fill="#26302b" opacity=".92"/>
    <text x="629" y="204" text-anchor="middle" font-size="15" font-weight="600" fill="#fffaf0">K3s · Traefik Ingress</text>
    <rect x="562" y="233" width="134" height="34" rx="9" fill="#e7f0e8" stroke="#a9bcae" stroke-width="2"/>
    <text x="629" y="255" text-anchor="middle" font-size="15" font-weight="600">host routing</text>
    <path d="M629 267 V284" stroke="#496f5d" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <rect x="525" y="299" width="61" height="35" rx="8" fill="#e7f0e8" stroke="#a9bcae" stroke-width="2"/>
    <rect x="598" y="299" width="61" height="35" rx="8" fill="#e7f0e8" stroke="#a9bcae" stroke-width="2"/>
    <rect x="671" y="299" width="61" height="35" rx="8" fill="#e7f0e8" stroke="#a9bcae" stroke-width="2"/>
    <text x="555" y="322" text-anchor="middle" font-size="13" font-weight="600">app 1</text>
    <text x="628" y="322" text-anchor="middle" font-size="13" font-weight="600">app 2</text>
    <text x="701" y="322" text-anchor="middle" font-size="13" font-weight="600">app 3</text>
    <text x="629" y="352" text-anchor="middle" font-size="13" font-weight="500">named hosts · catch-all route</text>

    <rect x="784" y="136" width="245" height="230" rx="14" fill="#fffaf0" stroke="#a9bcae" stroke-width="2"/>
    <text x="906" y="166" text-anchor="middle" font-size="18" font-weight="600">Part 3 · GitOps</text>
    <rect x="806" y="183" width="200" height="30" rx="8" fill="#26302b" opacity=".92"/>
    <text x="906" y="204" text-anchor="middle" font-size="15" font-weight="600" fill="#fffaf0">Docker · K3d · K3s</text>
    <rect x="815" y="230" width="182" height="33" rx="9" fill="#e7f0e8" stroke="#a9bcae" stroke-width="2"/>
    <text x="906" y="251" text-anchor="middle" font-size="14" font-weight="600">GitHub manifests</text>
    <path d="M906 263 V278" stroke="#496f5d" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <rect x="845" y="281" width="122" height="32" rx="9" fill="#e7f0e8" stroke="#a9bcae" stroke-width="2"/>
    <text x="906" y="302" text-anchor="middle" font-size="15" font-weight="600">Argo CD</text>
    <path d="M906 313 V326" stroke="#496f5d" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <rect x="824" y="329" width="164" height="27" rx="8" fill="#26302b" opacity=".92"/>
    <text x="906" y="348" text-anchor="middle" font-size="13" font-weight="600" fill="#fffaf0">dev application · self-heal</text>
  </g>
</svg>
